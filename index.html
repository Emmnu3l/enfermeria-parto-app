<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prototipo PAE - NANDA NOC NIC</title>
    <!-- Cargamos Tailwind CSS directamente desde CDN para que el diseño funcione al instante -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 md:p-8 font-sans">
    <div class="max-w-4xl mx-auto">
        
        <!-- Encabezado -->
        <header class="bg-blue-700 text-white p-6 rounded-t-lg shadow-md">
            <h1 class="text-2xl font-bold">Generador PLACE / PAE Clínico</h1>
            <p class="text-blue-200 mt-1">Base de datos interactiva: NANDA, NOC y NIC</p>
        </header>

        <!-- Buscador -->
        <div class="bg-white p-6 shadow-md rounded-b-lg mb-6">
            <input type="text" id="buscador" 
                   class="w-full p-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-lg transition-all" 
                   placeholder="🔍 Buscar diagnóstico (ej. 'retraso'), código NANDA o dominio...">
        </div>

        <!-- Contenedor donde aparecerán las tarjetas de diagnósticos -->
        <div id="resultados" class="space-y-6">
            <!-- Las tarjetas se inyectan aquí con JavaScript -->
        </div>
    </div>

    <script>
        // 1. BASE DE DATOS JSON (Aquí es donde agregarías tus 1,000+ diagnósticos después)
        const baseDatosPAE = [
            {
                id: "00112",
                diagnostico: "Riesgo de retraso en el desarrollo",
                dominio: "13 Crecimiento y desarrollo",
                noc: "0110 - Desarrollo infantil: 2 a 12 años",
                nic: "8240 - Fomento del desarrollo: Niños",
                actividades: [
                    "Evaluar periódicamente el crecimiento mediante gráficas de peso y talla.",
                    "Monitorear el desempeño escolar para descartar déficits de atención o aprendizaje tardíos."
                ]
            },
            {
                id: "00161",
                diagnostico: "Disposición para mejorar los conocimientos",
                dominio: "5 Percepción/Cognición",
                noc: "1805 - Conocimiento: Fomento de la salud",
                nic: "5602 - Enseñanza: Nutrición y Seguridad",
                actividades: [
                    "Capacitar sobre el Plato del Bien Comer y la hidratación adecuada.",
                    "Orientar sobre medidas de prevención de accidentes en la escuela y el hogar.",
                    "Garantizar el confort y respeto al pudor durante la exploración clínica."
                ]
            }
        ];

        // 2. LÓGICA DE BÚSQUEDA Y RENDERIZADO
        const buscador = document.getElementById('buscador');
        const contenedorResultados = document.getElementById('resultados');

        function mostrarResultados(filtro = "") {
            // Limpiamos la pantalla
            contenedorResultados.innerHTML = "";
            const textoBusqueda = filtro.toLowerCase();

            // Filtramos la base de datos
            const filtrados = baseDatosPAE.filter(item => 
                item.diagnostico.toLowerCase().includes(textoBusqueda) || 
                item.id.includes(textoBusqueda) ||
                item.dominio.toLowerCase().includes(textoBusqueda)
            );

            // Generamos el HTML (las tarjetas) para cada resultado
            filtrados.forEach(item => {
                // Convertimos la lista de actividades en viñetas HTML
                const actividadesHTML = item.actividades.map(act => 
                    `<li class="text-gray-700 text-sm list-disc ml-5 mb-1">${act}</li>`
                ).join('');
                
                const tarjeta = `
                    <div class="bg-white border-l-4 border-blue-600 shadow-md p-5 rounded-r-lg hover:shadow-lg transition-shadow">
                        <!-- Título NANDA -->
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4">
                            <h2 class="text-xl font-bold text-gray-800">
                                <span class="text-blue-600">[${item.id}]</span> ${item.diagnostico}
                            </h2>
                            <span class="mt-2 md:mt-0 bg-blue-100 text-blue-800 text-xs px-3 py-1 rounded-full font-semibold">
                                Dominio: ${item.dominio}
                            </span>
                        </div>
                        
                        <!-- Cajas de NOC y NIC -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="bg-green-50 p-4 rounded-lg border border-green-200">
                                <h3 class="font-bold text-green-800 text-sm mb-2 flex items-center">
                                    📈 Resultados Esperados (NOC)
                                </h3>
                                <p class="text-gray-800 font-medium text-sm">${item.noc}</p>
                            </div>
                            
                            <div class="bg-yellow-50 p-4 rounded-lg border border-yellow-200">
                                <h3 class="font-bold text-yellow-800 text-sm mb-2 flex items-center">
                                    🛠️ Intervenciones (NIC)
                                </h3>
                                <p class="text-gray-800 font-medium text-sm mb-3">${item.nic}</p>
                                
                                <h4 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Acciones Específicas</h4>
                                <ul class="mt-1">
                                    ${actividadesHTML}
                                </ul>
                            </div>
                        </div>
                    </div>
                `;
                contenedorResultados.innerHTML += tarjeta;
            });

            // Mensaje si no hay resultados
            if(filtrados.length === 0) {
                contenedorResultados.innerHTML = `<p class="text-gray-500 text-center py-8">No se encontraron diagnósticos que coincidan con "${filtro}".</p>`;
            }
        }

        // 3. EVENTO EN TIEMPO REAL: Se ejecuta cada vez que escribes una letra
        buscador.addEventListener('input', (e) => mostrarResultados(e.target.value));

        // Inicializamos mostrando todos los diagnósticos al cargar la página
        mostrarResultados();
    </script>
</body>
</html>
